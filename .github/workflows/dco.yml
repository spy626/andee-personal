# Requires a `Signed-off-by:` line on commits submitted from an external repository.
#
# This repository is the user's personal development fork. Pull requests between
# branches in this same repository are personal development, not submissions to
# the upstream KUAFUAI project, so the upstream contribution DCO is not required.
# External contributors' pull requests remain subject to the DCO check below.
#
# This check does not replace the upstream LICENSE A.2 contribution terms.
name: dco

on:
  pull_request:

jobs:
  signed-off-by:
    # Enforce DCO only when the PR head comes from a different repository.
    if: github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      # Full history: the range below cannot be resolved from a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every external contribution commit carries a Signed-off-by line
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # Imported exact upstream v0.8.0 Git history is third-party history;
          # preserve it unchanged rather than forging original contributor DCO.
          # The exemption applies ONLY if that pinned release is an ancestor,
          # and ONLY to commits reachable from that exact tag commit.
          upstream_v080='df667e69a342d462ff0bb4593a73d84a9509d059'
          exclusions=()
          if git merge-base --is-ancestor "$upstream_v080" "$head"; then
            exclusions+=("^$upstream_v080")
          fi
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <[^@]+@[^>]+>'; then
              subject=$(git log -1 --format='%h %s' "$sha")
              echo "::error::$subject has no Signed-off-by line"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base..$head" "${exclusions[@]}")

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add it with one of:"
            echo "  git commit --amend -s              # the last commit only"
            echo "  git rebase --signoff $base         # every commit on this branch"
            exit 1
          fi
